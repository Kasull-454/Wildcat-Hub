# Compila e pubblica le immagini dello stack su GHCR.
#
#   ghcr.io/<utente>/wildcat-hub-backend
#   ghcr.io/<utente>/wildcat-hub-worker     (FROM backend)
#   ghcr.io/<utente>/wildcat-hub-builder    (FROM backend)
#   ghcr.io/<utente>/wildcat-hub-frontend
#
# Quando parte:
#   * push su main        -> tag  latest  e  sha-<commit>
#   * tag git vX.Y.Z      -> tag  X.Y.Z   e  X.Y
#   * a mano (Actions → Run workflow)
#
# I test del backend girano dentro l'immagine appena costruita, prima del
# push: se falliscono non viene pubblicato niente. Il frontend viene
# controllato dal type-check di `next build`.
#
# Sul server, nel .env:
#   WILDCAT_IMAGE_PREFIX=ghcr.io/<utente>/wildcat-hub
#   WILDCAT_TAG=latest          (oppure una versione precisa)
# poi:  docker compose pull && docker compose up -d
name: Build e pubblicazione immagini

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "branding/**"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

# Una pubblicazione alla volta per ref, mai interrotta a metà: due push
# ravvicinati non devono far tornare indietro "latest".
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # Backend: build, test dentro l'immagine, push.
  # ------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nome immagine
        id: name
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}-backend"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build per i test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: wildcat-hub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Test (pytest dentro l'immagine)
        run: |
          docker run --rm --user root -v "$PWD/backend:/src:ro" -e HOME=/tmp \
            wildcat-hub-backend:ci sh -euc '
              pip install -q pytest pytest-asyncio
              cp -r /src /tmp/b && cd /tmp/b
              python -m pytest -q -p no:cacheprovider
            '

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ------------------------------------------------------------------
  # Frontend: indipendente, in parallelo.
  # ------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nome immagine
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ------------------------------------------------------------------
  # Worker e builder: partono dal backend appena pubblicato, fissato per
  # digest (non per tag) così non possono prendere un backend diverso.
  # ------------------------------------------------------------------
  derived:
    needs: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [worker, builder]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nome immagine
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build e push (FROM backend@digest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_IMAGE=${{ needs.backend.outputs.image }}@${{ needs.backend.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
